<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0ea5e9">
    <link rel="manifest" href="manifest.json">
    <title>OmniMind Vision OS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: '-apple-system', BlinkMacSystemFont, sans-serif; }
        body { background-color: #030712; color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 500px; height: 100vh; background: #0b0f19; display: flex; flex-direction: column; box-shadow: 0 0 35px rgba(56, 189, 248, 0.2); border: 1px solid #1e293b; }
        .header { padding: 15px 20px; background: #0f172a; border-bottom: 2px solid #0ea5e9; display: flex; justify-content: space-between; align-items: center; }
        .header-title h2 { color: #38bdf8; font-size: 1.25rem; font-weight: 800; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .header-title small { color: #64748b; font-size: 0.75rem; }
        .clear-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 15px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #070a12; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .ai-msg { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user-msg { background: #0ea5e9; color: #05070f; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 600; }
        .preview-container { display: none; width: 100%; background: #111827; padding: 10px; border-top: 1px solid #1e293b; text-align: center; position: relative; }
        .preview-img { max-height: 120px; max-width: 100%; border-radius: 8px; border: 1px solid #38bdf8; }
        .close-preview { position: absolute; top: 5px; right: 10px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 10px; }
        .input-area { padding: 15px; background: #0f172a; display: flex; gap: 8px; align-items: center; border-top: 1px solid #1e293b; }
        .input-area input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #334155; background: #1f2937; color: white; outline: none; font-size: 0.95rem; }
        .input-area input:focus { border-color: #38bdf8; }
        .btn-icon { background: #1f2937; border: 1px solid #334155; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; font-size: 1.2rem; transition: 0.2s; }
        .btn-icon:active { transform: scale(0.9); }
        #share-btn.active { background: #22c55e; border-color: #22c55e; }
        #upload-btn.active { background: #22c55e; border-color: #22c55e; }
        #mic-btn.recording { background: #ef4444; border-color: #ef4444; animation: pulse 1s infinite; }
        #send-btn { background: #38bdf8; color: #05070f; font-weight: bold; border: none; width: 60px; border-radius: 25px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        pre { background: #000; padding: 10px; border-radius: 5px; overflow-x: auto; color: #a7f3d0; margin: 5px 0; }
        code { color: #f43f5e; font-family: monospace; }
        .chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; border: 1px solid #334155; }
        .typing { opacity: 0.6; font-style: italic; }
        .typing .dots span { animation: blink 1.4s infinite; }
        .typing .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .model-select { background: #1f2937; color: #38bdf8; border: 1px solid #334155; border-radius: 10px; font-size: 0.7rem; padding: 4px 6px; font-weight: 600; }
        .export-btn { background: #334155; color: white; border: none; padding: 6px 10px; border-radius: 15px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .ai-msg { position: relative; padding-bottom: 22px; }
        .copy-btn { position: absolute; bottom: 4px; right: 8px; background: none; border: none; color: #64748b; font-size: 0.7rem; cursor: pointer; padding: 2px 6px; }
        .copy-btn:active { color: #38bdf8; }
        .copy-btn.copied { color: #22c55e; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-title">
                <h2>🧠 OmniMind Vision OS</h2>
                <small>Multimodal Analysis Engine</small>
            </div>
            <div class="header-actions">
                <select id="model-select" class="model-select" title="Model chunein">
                    <option value="fast">⚡ Fast</option>
                    <option value="smart">🧩 Smart (Reasoning)</option>
                </select>
                <button id="tts-btn" class="export-btn" onclick="toggleTTS()" title="Voice Output">🔇</button>
                <button class="export-btn" onclick="exportChat()">⬇ Save</button>
                <button class="clear-btn" onclick="clearChat()">Clear</button>
            </div>
        </div>

        <div class="chat-box" id="chat-box"></div>

        <div class="preview-container" id="preview-panel">
            <button class="close-preview" onclick="cancelScreenShot()">X</button>
            <img class="preview-img" id="screen-preview" src="" alt="Screen Preview">
        </div>

        <div class="input-area">
            <button id="share-btn" class="btn-icon" onclick="captureScreen()" title="Share Screen (Desktop)">🖥️</button>
            <button id="upload-btn" class="btn-icon" onclick="document.getElementById('file-input').click()" title="Screenshot Upload (Mobile)">📷</button>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
            <button id="mic-btn" class="btn-icon" onclick="startVoiceInput()" title="Voice Command">🎙️</button>
            <input id="user-input" type="text" placeholder="Screen share karein ya command likhein...">
            <button id="send-btn" class="btn-icon" onclick="askOmniMind()">➤</button>
        </div>
    </div>

    <video id="hidden-video" style="display:none;" autoplay></video>

    <script>
        // ⚠️ YAHA APNI REAL GROQ API KEY INVERTED COMMAS KE ANDAR DAALEIN
        const apiKey = "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";

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');
        const shareBtn = document.getElementById('share-btn');
        const previewPanel = document.getElementById('preview-panel');
        const screenPreview = document.getElementById('screen-preview');
        const hiddenVideo = document.getElementById('hidden-video');

        let base64Image = null;
        const modelSelect = document.getElementById('model-select');
        const ttsBtn = document.getElementById('tts-btn');
        let ttsEnabled = false;

        // Conversation memory: pichhle messages yaad rakhne ke liye (max last 12 turns)
        let conversationHistory = [];

        // ---- TOOL DEFINITIONS: AI khud decide karega inhe kab call karna hai ----
        const tools = [
            {
                type: "function",
                function: {
                    name: "calculate",
                    description: "Ek math expression evaluate karta hai (jaise '12*8+5' ya 'sqrt(144)')",
                    parameters: {
                        type: "object",
                        properties: {
                            expression: { type: "string", description: "Math expression, e.g. '15*3-4'" }
                        },
                        required: ["expression"]
                    }
                }
            },
            {
                type: "function",
                function: {
                    name: "get_current_datetime",
                    description: "Current date aur time batata hai user ke device ke hisaab se",
                    parameters: { type: "object", properties: {} }
                }
            }
        ];

        // Tool ko actually run karne wala local function
        function runTool(name, args) {
            try {
                if (name === "calculate") {
                    // Sirf safe math characters allow karein (security ke liye)
                    const expr = args.expression.replace(/[^0-9+\-*/().\s%^a-z]/gi, '');
                    const result = Function('"use strict"; return (' + expr.replace(/\^/g, '**') + ')')();
                    return JSON.stringify({ result });
                }
                if (name === "get_current_datetime") {
                    return JSON.stringify({ datetime: new Date().toString() });
                }
                return JSON.stringify({ error: "Unknown tool" });
            } catch (e) {
                return JSON.stringify({ error: "Calculation failed: " + e.message });
            }
        }

        // ---- TTS: AI ka jawab bol kar sunana ----
        function toggleTTS() {
            ttsEnabled = !ttsEnabled;
            ttsBtn.textContent = ttsEnabled ? '🔊' : '🔇';
            if (!ttsEnabled) window.speechSynthesis.cancel();
        }

        function speakText(text) {
            if (!ttsEnabled || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const plain = text.replace(/```[\s\S]*?```/g, ' code block ').replace(/[*_#]/g, '');
            const utter = new SpeechSynthesisUtterance(plain);
            utter.lang = 'hi-IN';
            utter.rate = 1;
            window.speechSynthesis.speak(utter);
        }

        // Enter key se bhi message bhej sakein
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') askOmniMind();
        });

        // System Startup Interface Message
        window.onload = function() {
            appendMessage("Vision System Online. 🖥️ Screen button daba kar screen capture karein, fir 🎙️ Mic se bolkar uska deep analysis puchiye!", 'ai-msg');
            registerServiceWorkerAndCheckShare();
        };

        // PWA Service Worker register karein aur agar koi doosri app se
        // image/text "share" karke aaye ho, use receive karein
        async function registerServiceWorkerAndCheckShare() {
            if (!('serviceWorker' in navigator)) return;
            try {
                await navigator.serviceWorker.register('sw.js');
            } catch (e) {
                console.warn("Service worker registration failed (normal if not hosted over https):", e);
                return;
            }

            const params = new URLSearchParams(window.location.search);
            if (params.get('shared') === '1' && 'caches' in window) {
                try {
                    const cache = await caches.open('omnimind-v1');
                    const res = await cache.match('shared-data');
                    if (res) {
                        const data = await res.json();
                        if (data.base64Image) {
                            base64Image = data.base64Image;
                            screenPreview.src = base64Image;
                            previewPanel.style.display = 'block';
                        }
                        if (data.text || data.title) {
                            userInput.value = data.text || data.title;
                        }
                        appendMessage("📥 Doosri app se content receive hua — ab bas Send dabayein!", 'ai-msg');
                        await cache.delete('shared-data');
                    }
                    // URL clean kar dein
                    window.history.replaceState({}, '', window.location.pathname);
                } catch (e) {
                    console.warn("Shared data read failed:", e);
                }
            }
        }

        function appendMessage(text, className) {
            const msgId = 'msg-' + Date.now() + Math.random().toString(36).substr(2, 4);
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${className}`;
            msgDiv.id = msgId;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgId;
        }

        function updateMessageHTML(msgId, htmlContent) {
            const msgDiv = document.getElementById(msgId);
            if (msgDiv) {
                msgDiv.innerHTML = htmlContent;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // Basic markdown-ish formatting: ```code``` blocks and **bold**
        function formatResponse(text) {
            let safe = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            safe = safe.replace(/```([a-zA-Z]*)\n?([\s\S]*?)```/g, function(_, lang, code) {
                return `<pre><code>${code.trim()}</code></pre>`;
            });
            safe = safe.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            safe = safe.replace(/\n/g, '<br>');
            return safe;
        }

        function clearChat() {
            chatBox.innerHTML = '';
            conversationHistory = [];
            appendMessage("Vision System Reset Completed. Memory bhi clear kar di gayi hai.", 'ai-msg');
        }

        // Puri chat ko .txt file mein export/download karein
        function exportChat() {
            if (conversationHistory.length === 0) {
                alert("Export karne ke liye pehle kuch baatcheet karein.");
                return;
            }
            let text = "OmniMind Vision OS - Chat Export\n";
            text += new Date().toLocaleString() + "\n\n";
            conversationHistory.forEach(m => {
                const speaker = m.role === 'user' ? 'Aap' : 'OmniMind';
                const content = typeof m.content === 'string'
                    ? m.content
                    : m.content.map(c => c.type === 'text' ? c.text : '[Image]').join(' ');
                text += `${speaker}: ${content}\n\n`;
            });
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `omnimind-chat-${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Response text ko clipboard mein copy karein
        function copyToClipboard(msgId, btnEl) {
            const el = document.getElementById(msgId);
            const clone = el.cloneNode(true);
            const btn = clone.querySelector('.copy-btn');
            if (btn) btn.remove();
            const text = clone.innerText;
            navigator.clipboard.writeText(text).then(() => {
                btnEl.textContent = '✓ Copied';
                btnEl.classList.add('copied');
                setTimeout(() => {
                    btnEl.textContent = '⧉ Copy';
                    btnEl.classList.remove('copied');
                }, 1500);
            }).catch(() => {
                alert("Copy nahi ho paya, aapka browser support nahi karta.");
            });
        }

        // Screen Capture Feed Handler
        async function captureScreen() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                hiddenVideo.srcObject = stream;
                await hiddenVideo.play();

                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1280;
                    canvas.height = 720;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);

                    base64Image = canvas.toDataURL('image/jpeg');
                    screenPreview.src = base64Image;
                    previewPanel.style.display = 'block';
                    shareBtn.classList.add('active');

                    stream.getTracks().forEach(track => track.stop());
                }, 800);
            } catch (err) {
                console.error("Screen Share Denied: ", err);
                alert("Screen share failed or not supported on this device/browser.");
            }
        }

        function cancelScreenShot() {
            base64Image = null;
            previewPanel.style.display = 'none';
            shareBtn.classList.remove('active');
            document.getElementById('upload-btn').classList.remove('active');
        }

        // Mobile Screenshot Upload Handler — real screenshot/photo select karke
        // usse analysis ke liye bhejein (mobile browsers live screen-capture
        // API support nahi karte, isliye ye real-data alternative hai)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert("Kripya sirf image file select karein.");
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                base64Image = e.target.result;
                screenPreview.src = base64Image;
                previewPanel.style.display = 'block';
                document.getElementById('upload-btn').classList.add('active');
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // taaki dobara same file select ho sake
        }

        // Voice Command Input Engine
        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Aapka browser voice input support nahi karta.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';

            recognition.onstart = () => { micBtn.classList.add('recording'); };
            recognition.onend = () => { micBtn.classList.remove('recording'); };

            recognition.onresult = (e) => {
                const speechToText = e.results[0][0].transcript;
                userInput.value = speechToText;
                askOmniMind();
            };

            recognition.onerror = (err) => {
                console.error("Speech error: ", err);
                micBtn.classList.remove('recording');
            };

            recognition.start();
        }

        // Streaming API call helper: Groq se live token-by-token response leta hai
        async function streamChatCompletion(model, messages, useTools, onToken) {
            const body = {
                model: model,
                messages: messages,
                max_tokens: 1024,
                stream: true
            };
            if (useTools) {
                body.tools = tools;
                body.tool_choice = "auto";
            }

            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API Error ${response.status}: ${errText}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            let toolCalls = null;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed.startsWith('data:')) continue;
                    const dataStr = trimmed.slice(5).trim();
                    if (dataStr === '[DONE]') continue;
                    try {
                        const json = JSON.parse(dataStr);
                        const delta = json.choices && json.choices[0] && json.choices[0].delta;
                        if (!delta) continue;

                        if (delta.content) {
                            fullText += delta.content;
                            onToken(fullText);
                        }
                        if (delta.tool_calls) {
                            if (!toolCalls) toolCalls = [];
                            for (const tc of delta.tool_calls) {
                                const idx = tc.index || 0;
                                if (!toolCalls[idx]) toolCalls[idx] = { id: tc.id, type: "function", function: { name: '', arguments: '' } };
                                if (tc.function?.name) toolCalls[idx].function.name += tc.function.name;
                                if (tc.function?.arguments) toolCalls[idx].function.arguments += tc.function.arguments;
                                if (tc.id) toolCalls[idx].id = tc.id;
                            }
                        }
                    } catch (e) { /* incomplete JSON chunk, skip */ }
                }
            }

            return { fullText, toolCalls };
        }

        // API Gateway Communication Architecture (streaming + tool-calling)
        async function askOmniMind() {
            const query = userInput.value.trim();
            if (!query && !base64Image) {
                alert("Kripya kuch type karein ya screen share karein!");
                return;
            }

            if (apiKey === "YOUR_GROQ_API_KEY_HERE" || !apiKey) {
                alert("Setup Alert: Please add your valid Groq API key in the script!");
                return;
            }

            const finalQuery = query || "Is screen ka detailed analysis karo.";
            const userMsgId = appendMessage(finalQuery, 'user-msg');

            const imageForThisRequest = base64Image;

            if (imageForThisRequest) {
                document.getElementById(userMsgId).innerHTML += `<br><img class="chat-img" src="${imageForThisRequest}">`;
            }

            userInput.value = '';
            base64Image = null;
            previewPanel.style.display = 'none';
            shareBtn.classList.remove('active');

            const typingId = appendMessage('', 'ai-msg typing');
            updateMessageHTML(typingId, `OmniMind soch raha hai<span class="dots"><span>.</span><span>.</span><span>.</span></span>`);

            try {
                let userContent;
                if (imageForThisRequest) {
                    userContent = [
                        { type: "text", text: finalQuery },
                        { type: "image_url", image_url: { url: imageForThisRequest } }
                    ];
                } else {
                    userContent = finalQuery;
                }

                conversationHistory.push({ role: "user", content: userContent });
                let workingMessages = conversationHistory.slice(-12);

                // Vision ke liye tool-calling nahi (Groq vision models tools support nahi karte)
                const useTools = !imageForThisRequest;
                let model;
                if (imageForThisRequest) {
                    model = "qwen/qwen3.6-27b";
                } else if (modelSelect.value === "smart") {
                    model = "qwen/qwen3.6-27b";
                } else {
                    model = "openai/gpt-oss-120b";
                }

                let firstMsgShown = false;

                // Pehla pass: model ko live stream karke poochein
                let { fullText, toolCalls } = await streamChatCompletion(model, workingMessages, useTools, (partial) => {
                    if (!firstMsgShown) { document.getElementById(typingId).classList.remove('typing'); firstMsgShown = true; }
                    updateMessageHTML(typingId, formatResponse(partial) + '<span class="dots"><span>▍</span></span>');
                });

                // Agar model ne tool call maanga hai, use run karke dobara poochein
                if (toolCalls && toolCalls.length > 0) {
                    updateMessageHTML(typingId, `🔧 Tool use kar raha hoon (${toolCalls[0].function.name})...`);

                    workingMessages.push({ role: "assistant", content: fullText || null, tool_calls: toolCalls });

                    for (const tc of toolCalls) {
                        let args = {};
                        try { args = JSON.parse(tc.function.arguments); } catch (e) {}
                        const result = runTool(tc.function.name, args);
                        workingMessages.push({ role: "tool", tool_call_id: tc.id, content: result });
                    }

                    firstMsgShown = false;
                    const second = await streamChatCompletion(model, workingMessages, false, (partial) => {
                        if (!firstMsgShown) { updateMessageHTML(typingId, ''); firstMsgShown = true; }
                        updateMessageHTML(typingId, formatResponse(partial) + '<span class="dots"><span>▍</span></span>');
                    });
                    fullText = second.fullText;
                }

                if (!fullText) fullText = "Maaf kijiye, koi response nahi mila.";

                conversationHistory.push({ role: "assistant", content: fullText });

                const copyBtnHTML = `<button class="copy-btn" onclick="copyToClipboard('${typingId}', this)">⧉ Copy</button>`;
                updateMessageHTML(typingId, formatResponse(fullText) + copyBtnHTML);
                document.getElementById(typingId).classList.remove('typing');

                speakText(fullText);

            } catch (err) {
                console.error("OmniMind API Error: ", err);
                conversationHistory.pop();
                updateMessageHTML(typingId, "⚠️ Error: " + err.message);
                document.getElementById(typingId).classList.remove('typing');
            }
        }
    </script>
</body>
</html>
